---
# Note that dependencies listed here are automatically installed
# before this role.  Role variables for any roles listed here can be
# assigned static variables.
#
# See also cisagov/skeleton-ansible-role#153.
dependencies:
  - name: freeipa_client
    src: https://github.com/cisagov/ansible-role-freeipa-client
galaxy_info:
  author: Shane Frasier
  company: CISA Cyber Assessments
  description: Create the joiner user, which can join the host to the IPA domain.
  galaxy_tags:
    - ipa
    - freeipa
  license: CC0-1.0
  # With the release of version 2.10, Ansible finally correctly
  # identifies Kali Linux as being the Kali distribution of the Debian
  # OS family.  This simplifies a lot of things for roles that support
  # Kali Linux, so it makes sense to force the installation of Ansible
  # 2.10 or newer.
  min_ansible_version: "2.10"
  namespace: cisagov
  platforms:
    # Amazon Linux does not (yet?) provide a FreeIPA client package,
    # which is required for this Ansible role.
    # - name: Amazon Linux
    #   versions:
    #     - "2023"
    - name: Debian
      versions:
        - buster
        - bullseye
        - bookworm
        # Debian Trixie does not currently offer an IPA client package:
        # https://packages.debian.org/search?suite=all&searchon=names&keywords=freeipa
        # - trixie
    - name: Fedora
      versions:
        - "39"
        - "40"
    # Kali is based on Debian Trixie and therefore does not currently offer an
    # IPA client package either:
    # https://packages.debian.org/search?suite=all&searchon=names&keywords=freeipa
    # - name: Kali
    #   versions:
    #     - "2023"
    - name: Ubuntu
      versions:
        - focal
        - jammy
        - noble
  role_name: joiner_user
  standalone: true
